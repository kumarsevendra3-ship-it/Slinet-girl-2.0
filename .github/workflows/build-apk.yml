name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR_VER" ]; then
            echo "ERROR: Failed to detect active Java version."
            exit 1
          fi
          echo "Detected active Java major version: $JAVA_MAJOR_VER"
          if [ "$JAVA_MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Active Java major version must be 17 or newer, found $JAVA_MAJOR_VER."
            exit 1
          fi
          echo "Java environment verification passed."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to generate temporary debug keystore."
              exit 1
            fi
            echo "Temporary debug keystore generated successfully."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at: $EXPECTED_APK"
            echo "Searching inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Verified debug APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: File does not have .apk extension: $EXPECTED_APK"
              exit 1
              ;;
          esac

          FILE_SIZE=$(wc -c < "$EXPECTED_APK")
          echo "Verified debug APK: $EXPECTED_APK (Size: $FILE_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RAW_REPO_NAME="${{ github.repository }}"
          REPO_BASENAME=$(basename "$RAW_REPO_NAME")
          SAFE_REPO_NAME=$(echo "$REPO_BASENAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"

          RUNNER_TEMP_DIR=$(mktemp -d)
          TARGET_ASSET_PATH="$RUNNER_TEMP_DIR/$ASSET_FILENAME"

          cp "$SOURCE_APK" "$TARGET_ASSET_PATH"

          if [ ! -f "$TARGET_ASSET_PATH" ] || [ ! -s "$TARGET_ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $TARGET_ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $TARGET_ASSET_PATH"
          echo "asset_path=$TARGET_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          if ! command -v gh &> /dev/null; then
            echo "ERROR: GitHub CLI (gh) is not available."
            exit 1
          fi

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset is not an APK file: $ASSET_PATH"
              exit 1
              ;;
          esac

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Creating GitHub Release with tag: $TAG_NAME"

          cat << 'EOF' > /tmp/release_notes.md
          ### Automated Debug Build
          - **Build Type:** Automatically generated debug APK
          - **Built by:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** ${{ github.sha }}
          - **Intended Use:** Testing and development
          - **Important Notice:** This APK is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md \
            --latest

          echo "Release created successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Publishing Succeeded ==="
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME")
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"

            echo "### 🚀 Debug APK Build & Release Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**GitHub Release:** [$RELEASE_TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "**Release Tag:** \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "**APK Asset:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📱 **Download Instructions:** You can download the APK directly onto your phone from the **Assets** section of the [Release Page]($RELEASE_URL)." >> "$GITHUB_STEP_SUMMARY"
            echo "📦 **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also available for this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped, but the debug APK build succeeded."
            echo "The Actions artifact 'app-debug-apk' is preserved and available for download."

            echo "### ⚠️ Debug APK Built - Release Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built successfully and uploaded as a GitHub Actions artifact named **\`app-debug-apk\`**." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Note:** Automatic GitHub Release publishing was not completed, but your APK is safe and ready to download from the Actions artifacts section on this run." >> "$GITHUB_STEP_SUMMARY"
          fi
